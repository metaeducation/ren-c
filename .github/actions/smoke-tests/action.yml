name: Ren-C Interpreter Smoke Tests
description: Run common smoke tests against a built Ren-C interpreter

inputs:
  executable:
    description: Path to the built interpreter executable
    required: true
  test-exit-codes:
    description: Also test panic and quit exit codes
    required: false
    default: 'false'
  tests-directory:
    description: Path to the tests directory
    required: false
    default: tests
  test-rebmake-help:
    description: Also test Rebmake help output
    required: false
    default: 'false'
  test-http:
    description: Test HTTP access when Network and DNS are enabled
    required: false
    default: 'true'
  uuid-library:
    description: Optional path to a UUID extension built as a shared library
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Basic Smoke Test (Print A Message And Quit)
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "print -[hi]-"

    - name: Show Build Date
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "print [-[Build info:]- system.build]"

    - name: Show Version/Platform Information
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "print [-[Version:]- @system.version]"

    - name: Test Basic Arithmetic
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "print [-[Math test:]- 2 + 2]"

    - name: Test String Operations
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "print [-[String test:]- uppercase -[hello world]-]"

    - name: Test Basic Control Structures
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "repeat 3 [print -[counting to three...]-]"

    - name: Test Rebmake HELP functionality
      if: inputs.test-rebmake-help == 'true'
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" make.r --help
        "$R3_EXECUTABLE" make.r --help all


    # Besides just testing success cases, it's important to make sure panics
    # actually report bad exit codes, or a lot of the GitHub Actions intended
    # for testing will be useless.
    #
    # Since GitHub Actions spawns the shell as `bash -e` this means any errors
    # will terminate the step.  Use `set +e` to disable this mode...as trying
    # to capture the exit code without raising an error is a nuisance.

    - name: PANIC Test (from code on command line)
      if: inputs.test-exit-codes == 'true'
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        set +e  # so nonzero exit codes won't immediately terminate step
        "$R3_EXECUTABLE" --do "panic --[Error Message]--"
        status=$?
        if [ "$status" -eq 1 ]; then
          echo "PANIC Properly Gave Exit Status 1"
        else
          echo "Expected Exit Status 1, But Got $status"
          exit 1
        fi

    - name: PANIC Test (from running a script)
      if: inputs.test-exit-codes == 'true'
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
        R3_TESTS_DIRECTORY: ${{ inputs.tests-directory }}
      run: |
        test -f "$R3_TESTS_DIRECTORY/misc/panic-script.r" || {
          echo "Cannot find panic script in $R3_TESTS_DIRECTORY/misc" >&2
          exit 1
        }
        set +e  # so nonzero exit codes won't immediately terminate step
        "$R3_EXECUTABLE" "$R3_TESTS_DIRECTORY/misc/panic-script.r"
        status=$?
        if [ "$status" -eq 1 ]; then
          echo "PANIC Properly Gave Exit Status 1"
        else
          echo "Expected Exit Status 1, But Got $status"
          exit 1
        fi

    - name: QUIT Test (from code on command line)
      if: inputs.test-exit-codes == 'true'
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        set +e  # so nonzero exit codes won't immediately terminate step
        "$R3_EXECUTABLE" --do "quit 3"
        status=$?
        if [ "$status" -eq 3 ]; then
          echo "QUIT Properly Gave Exit Status 3"
        else
          echo "Expected Exit Status 3, But Got $status"
          exit 1
        fi

    - name: QUIT Test (from running a script)
      if: inputs.test-exit-codes == 'true'
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
        R3_TESTS_DIRECTORY: ${{ inputs.tests-directory }}
      run: |
        test -f "$R3_TESTS_DIRECTORY/misc/quit-script.r" || {
          echo "Cannot find quit script in $R3_TESTS_DIRECTORY/misc" >&2
          exit 1
        }
        set +e  # so nonzero exit codes won't immediately terminate step
        "$R3_EXECUTABLE" "$R3_TESTS_DIRECTORY/misc/quit-script.r"
        status=$?
        if [ "$status" -eq 3 ]; then
          echo "QUIT Properly Gave Exit Status 3"
        else
          echo "Expected Exit Status 3, But Got $status"
          exit 1
        fi


    # Note: HTTPS no longer works due to missing cipher suites, and due to
    # the web build being a priority that work is not being pursued.
    #
    - name: HTTP Read Test (If This Works, A Lot Of Things Are Working)
      if: inputs.test-http == 'true'
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "$(cat <<'REBOL'
        print "== Hello From R3 HTTP Read Test! =="
        header: parse as text! read http://example.com [
            thru '<title> accept across to '</title>  ; changed from <h1>, 2026
        ]
        assert [header = "Example Domain"]
        print ["Succeeded:" header]
        REBOL
        )"


    - name: Test UUID Extension Built As DLL
      if: inputs.uuid-library != ''
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
        R3_UUID_LIBRARY: ${{ inputs.uuid-library }}
      run: |
        "$R3_EXECUTABLE" --do "$(cat <<'REBOL'
        print "== Hello From R3 DLL Test! =="
        mod-uuid: load-extension to file! get-env 'R3_UUID_LIBRARY
        print "== UUID Extension Loaded =="
        uuid: mod-uuid/generate
        assert [16 = length of uuid]
        print ["Succeeded:" uuid]
        REBOL
        )"

    - name: Test Clean Exit
      shell: bash
      env:
        R3_EXECUTABLE: ${{ inputs.executable }}
      run: |
        "$R3_EXECUTABLE" --do "print -[All tests passed!]- quit 0"
